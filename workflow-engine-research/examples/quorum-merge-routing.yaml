# Quorum Merge Routing Workflow

id: quorum-merge-routing
version: 1.0.0

metadata:
  name: "Quorum Merge Routing"
  description: "Collects parallel branch outputs and continues after quorum"
  tags: ["example", "parallel", "merge", "quorum"]

entry_node: fanout

nodes:
  - id: fanout
    node_type:
      parallel:
        nodes: [worker_a, worker_b, worker_c]

  - id: worker_a
    node_type:
      custom_worker:
        language: python
        handler: VoteA

  - id: worker_b
    node_type:
      custom_worker:
        language: go
        handler: VoteB

  - id: worker_c
    node_type:
      custom_worker:
        language: typescript
        handler: VoteC

  - id: quorum_merge
    node_type:
      merge:
        policy:
          type: quorum
          minimum: 2

  - id: notify
    node_type:
      llm_call:
        provider: openai
        model: gpt-4o-mini
    config:
      prompt: "Summarize quorum decision: {{ $.nodes.quorum_merge.output }}"

edges:
  - from: worker_a
    to: quorum_merge
  - from: worker_b
    to: quorum_merge
  - from: worker_c
    to: quorum_merge
  - from: quorum_merge
    to: notify
