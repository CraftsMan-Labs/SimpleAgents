# Loop With Guard Workflow

id: loop-with-guard
version: 1.0.0

metadata:
  name: "Loop With Max Iterations"
  description: "Shows loop condition with explicit max iteration safety"
  tags: ["example", "loop", "safety"]

entry_node: start

nodes:
  - id: start
    node_type:
      transform:
        expression: '{"counter": 0}'

  - id: loop_gate
    node_type:
      loop:
        condition: "$.nodes.increment.output.counter < 3"
        body: increment
        max_iterations: 5

  - id: increment
    node_type:
      custom_worker:
        language: rust
        handler: IncrementCounter

  - id: end
    node_type:
      transform:
        expression: '{"status":"done"}'

edges:
  - from: start
    to: loop_gate
  - from: loop_gate
    to: end
