# Batch Filter Pipeline Workflow

id: batch-filter-pipeline
version: 1.0.0

metadata:
  name: "Batch and Filter Pipeline"
  description: "Extracts list input, filters with guard expression, then routes"
  tags: ["example", "batch", "filter"]

entry_node: batch_items

nodes:
  - id: batch_items
    node_type:
      batch:
        items_path: "$.input.items"

  - id: filter_items
    node_type:
      filter:
        items_path: "$.nodes.batch_items.output"
        condition: "$.item.priority == \"high\""

  - id: route
    node_type:
      switch:
        branches:
          - condition: "size($.nodes.filter_items.output) > 0"
            target: escalate
        default: archive

  - id: escalate
    node_type:
      custom_worker:
        language: python
        handler: EscalateBatch

  - id: archive
    node_type:
      transform:
        expression: '{"action":"archive"}'

edges:
  - from: batch_items
    to: filter_items
  - from: filter_items
    to: route
