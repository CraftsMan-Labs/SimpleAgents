# Multi-Language Workflow
# Demonstrates: Custom workers in Python, Go, TypeScript

id: multi-language-workflow
version: 1.0.0

metadata:
  name: "Multi-Language Workflow"
  description: "Demonstrates nodes in different languages"
  tags: ["example", "multi-language", "workers"]

entry_node: validate_input

nodes:
  # Step 1: Python validation
  - id: validate_input
    name: "Validate Input (Python)"
    node_type:
      custom_worker:
        language: python
        handler: ValidateInput

    timeout: 10s

  # Step 2: LLM analysis
  - id: analyze_data
    name: "Analyze Data (LLM)"
    node_type:
      llm_call:
        provider: openai
        model: gpt-4

    config:
      prompt: "Analyze this data: {{ input.data }}"

  # Step 3: Go processing (high performance)
  - id: process_results
    name: "Process Results (Go)"
    node_type:
      custom_worker:
        language: go
        handler: ProcessResults

    timeout: 30s

  # Step 4: TypeScript formatting
  - id: format_output
    name: "Format Output (TypeScript)"
    node_type:
      custom_worker:
        language: typescript
        handler: FormatOutput

    timeout: 10s

edges:
  - from: validate_input
    to: analyze_data

  - from: analyze_data
    to: process_results

  - from: process_results
    to: format_output
