[package]
name = "simple-agents-napi"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi4", "serde-json"] }
napi-derive = "2.16"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }

simple-agents-core = { path = "../simple-agents-core", version = "0.2.5" }
simple-agents-providers = { path = "../simple-agents-providers", version = "0.2.5" }
simple-agent-type = { workspace = true }
simple-agents-healing = { path = "../simple-agents-healing", version = "0.2.5" }
