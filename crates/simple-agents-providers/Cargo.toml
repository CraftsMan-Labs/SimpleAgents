[package]
name = "simple-agents-providers"
version.workspace = true
edition = "2021"
authors = ["SimpleAgents Contributors"]
description = "LLM provider implementations for SimpleAgents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/SimpleAgents"

[dependencies]
simple-agent-type = { workspace = true }
simple-agents-healing = { path = "../simple-agents-healing", version = "0.3.11" }
reqwest = { version = "0.12", features = ["json", "stream", "default-tls", "http2", "gzip", "brotli", "deflate"], default-features = false }
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2.0"
tracing = "0.1"
httpdate = "1.0"

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = "0.3"
dotenv = "0.15"
