[package]
name = "simple-agents-providers"
version.workspace = true
edition = "2021"
authors = ["SimpleAgents Contributors"]
description = "LLM provider implementations for SimpleAgents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/SimpleAgents"

[package.metadata.simpleagents.dependency-policy]
minimum-release-age = "182 days"

[dependencies]
simple-agent-type = { workspace = true }
simple-agents-healing = { path = "../simple-agents-healing", version = "0.5.2" }
reqwest = { version = "=0.12.28", features = ["json", "stream", "default-tls", "http2", "gzip", "brotli", "deflate"], default-features = false }
tokio = { version = "=1.52.3", features = ["full"] }
futures = "=0.3.32"
futures-core = "=0.3.32"
futures-util = "=0.3.32"
bytes = "=1.11.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
async-trait = "=0.1.89"
thiserror = "=2.0.18"
tracing = "=0.1.44"
httpdate = "=1.0.3"

[features]
default = []

[dev-dependencies]
tokio-test = "=0.4.5"
tracing-subscriber = "=0.3.23"
dotenv = "=0.15.0"
