syntax = "proto3";

package workflow.worker.v1;

service WorkerService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ExecuteRequest {
  string request_id = 1;
  string workflow_name = 2;
  string node_id = 3;
  string operation = 4;
  string target = 5;
  // Legacy compatibility fallback for older workers/clients.
  string payload_json = 6;
  optional uint64 timeout_ms = 7;
  map<string, string> metadata = 8;

  oneof typed_payload {
    LlmPayload llm_payload = 9;
    ToolPayload tool_payload = 10;
  }
}

message LlmPayload {
  string prompt = 1;
  string scoped_input_json = 2;
}

message ToolPayload {
  string input_json = 1;
  string scoped_input_json = 2;
}

message WorkerError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message ExecuteResponse {
  string request_id = 1;
  string worker_id = 2;
  uint64 elapsed_ms = 3;
  bool ok = 4;
  string output_json = 5;
  WorkerError error = 6;
}

message HealthRequest {}

enum HealthStatus {
  HEALTH_STATUS_UNKNOWN = 0;
  HEALTH_STATUS_SERVING = 1;
  HEALTH_STATUS_NOT_SERVING = 2;
}

message HealthResponse {
  string worker_id = 1;
  HealthStatus status = 2;
  uint32 consecutive_failures = 3;
  optional uint64 last_probe_unix_ms = 4;
}
