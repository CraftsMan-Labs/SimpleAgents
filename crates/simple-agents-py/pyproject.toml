[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "simple-agents-py"
version = "0.5.1"
description = "Python bindings for SimpleAgents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["pydantic>=2.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-dotenv>=1.0"]
pydantic = []

[tool.maturin]
bindings = "pyo3"
module-name = "simple_agents_py"
python-source = "python"
# Stubs and py.typed live under python/simple_agents_py/ (PEP 561 inline package).

[tool.pytest.ini_options]
testpaths = ["tests"]
