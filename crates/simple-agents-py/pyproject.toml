[build-system]
requires = ["maturin==1.13.3"]
build-backend = "maturin"

[project]
name = "simple-agents-py"
version = "0.5.2"
description = "Python bindings for SimpleAgents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["pydantic==2.12.5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "python-dotenv==1.2.1"]
pydantic = []

[tool.maturin]
bindings = "pyo3"
module-name = "simple_agents_py"
python-source = "python"
# Stubs and py.typed live under python/simple_agents_py/ (PEP 561 inline package).

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.simpleagents.dependency-policy]
minimum-release-age = "182 days"
