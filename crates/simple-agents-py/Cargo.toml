[package]
name = "simple-agents-py"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "simple_agents_py"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"] }
pythonize = "0.22"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
async-trait = "0.1"

simple-agents-core = { path = "../simple-agents-core", version = "0.4.0" }
simple-agents-healing = { path = "../simple-agents-healing", version = "0.4.0" }
simple-agents-providers = { path = "../simple-agents-providers", version = "0.4.0" }
simple-agent-type = { workspace = true }
simple-agents-workflow = { path = "../simple-agents-workflow", version = "0.4.0" }
