id: python-intern-fun-interview-system
version: 1.0.0

entry_node: detect_scenario_context

nodes:
  - id: detect_scenario_context
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          state:
            type: string
            enum:
              [
                ready,
                missing_scenario,
                capabilities_query,
                terminated_already,
                policy_violation,
              ]
          reason:
            type: string
        required: [state, reason]
        additionalProperties: false
      prompt: |
        Determine interview state.
        Return JSON only with state and reason.

  - id: route_scenario_state
    node_type:
      switch:
        branches:
          - condition: '$.nodes.detect_scenario_context.output.state == "terminated_already"'
            target: already_terminated
          - condition: '$.nodes.detect_scenario_context.output.state == "policy_violation"'
            target: terminate_candidate
          - condition: '$.nodes.detect_scenario_context.output.state == "capabilities_query"'
            target: explain_capabilities
          - condition: '$.nodes.detect_scenario_context.output.state == "ready"'
            target: evaluate_interview_submission
        default: ask_for_scenario

  - id: already_terminated
    node_type:
      custom_worker:
        handler: GetRagData
    config:
      payload:
        topic: already_terminated

  - id: explain_capabilities
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          question:
            type: string
        required: [question]
        additionalProperties: false
      prompt: |
        Explain interview flow and ask one question.
        Return JSON only: {"question":"..."}

  - id: ask_for_scenario
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          question:
            type: string
        required: [question]
        additionalProperties: false
      prompt: |
        Ask for candidate attempt.
        Return JSON only: {"question":"..."}

  - id: evaluate_interview_submission
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          status:
            type: string
            enum:
              [terminate_candidate, continue_interview, need_candidate_attempt]
          reason:
            type: string
          feedback:
            type: string
          next_prompt:
            type: string
        required: [status, reason, feedback, next_prompt]
        additionalProperties: false
      prompt: |
        Evaluate process quality.
        Return JSON only with status, reason, feedback, next_prompt.

  - id: route_evaluation_result
    node_type:
      switch:
        branches:
          - condition: '$.nodes.evaluate_interview_submission.output.status == "terminate_candidate"'
            target: terminate_candidate
          - condition: '$.nodes.evaluate_interview_submission.output.status == "continue_interview"'
            target: continue_interview
        default: ask_candidate_attempt

  - id: terminate_candidate
    node_type:
      custom_worker:
        handler: GetRagData
    config:
      payload:
        topic: terminated

  - id: continue_interview
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          decision:
            type: string
          message:
            type: string
        required: [decision, message]
        additionalProperties: false
      prompt: |
        Continue interview.
        Return JSON only: {"decision":"continue","message":"..."}

  - id: ask_candidate_attempt
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          question:
            type: string
        required: [question]
        additionalProperties: false
      prompt: |
        Ask for fuller candidate attempt.
        Return JSON only: {"question":"..."}

edges:
  - from: detect_scenario_context
    to: route_scenario_state
  - from: evaluate_interview_submission
    to: route_evaluation_result
