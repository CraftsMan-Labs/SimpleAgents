id: email-chat-draft-or-clarify
version: 1.0.0

entry_node: detect_scenario_context

nodes:
  - id: detect_scenario_context
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          state:
            type: string
            enum: [ready, missing_scenario, capabilities_query]
          reason:
            type: string
        required: [state, reason]
        additionalProperties: false
      prompt: |
        Determine user intent.
        Return JSON only:
        {
          "state": "ready" | "missing_scenario" | "capabilities_query",
          "reason": "short explanation"
        }

  - id: route_scenario_state
    node_type:
      switch:
        branches:
          - condition: '$.nodes.detect_scenario_context.output.state == "capabilities_query"'
            target: explain_capabilities
          - condition: '$.nodes.detect_scenario_context.output.state == "ready"'
            target: generate_email_draft
        default: ask_for_scenario

  - id: explain_capabilities
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          question:
            type: string
        required: [question]
        additionalProperties: false
      prompt: |
        Explain capabilities and ask one follow-up question.
        Return JSON only:
        {"question":"..."}

  - id: ask_for_scenario
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          question:
            type: string
        required: [question]
        additionalProperties: false
      prompt: |
        Ask for missing scenario details.
        Return JSON only:
        {"question":"..."}

  - id: generate_email_draft
    node_type:
      llm_call:
        model: gemini-3-flash
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          subject:
            type: string
          body:
            type: string
        required: [subject, body]
        additionalProperties: false
      prompt: |
        Draft a professional email.
        Return JSON only:
        {"subject":"...","body":"..."}

edges:
  - from: detect_scenario_context
    to: route_scenario_state
