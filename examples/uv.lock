version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "examples"
version = "0.1.10"
source = { virtual = "." }
dependencies = [
    { name = "simple-agents-py" },
]

[package.metadata]
requires-dist = [{ name = "simple-agents-py", directory = "../crates/simple-agents-py" }]

[[package]]
name = "simple-agents-py"
version = "0.1.10"
source = { directory = "../crates/simple-agents-py" }

[package.metadata]
requires-dist = [{ name = "pytest", marker = "extra == 'dev'", specifier = ">=8.0" }]
provides-extras = ["dev"]
