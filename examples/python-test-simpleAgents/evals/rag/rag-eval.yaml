id: mocked-rag-chunk-eval
workflow_path: ../../workflows/rag/rag-eval-workflow.yaml
dataset_path: rag-eval.dataset.jsonl
max_concurrency: 1

execution:
  node_llm_streaming: false
workflow_options:
  telemetry:
    enabled: false

comparison:
  mode: paths
  paths:
    - $.terminal_node

custom_evals:
  - id: rag-accuracy
    handler: evaluate_rag_chunks
    handler_file: rag_eval_handlers.py
    actual_path: $.outputs.retrieve_chunks.output
    expected_path: $.custom.expected_sources
    threshold: 0.8
