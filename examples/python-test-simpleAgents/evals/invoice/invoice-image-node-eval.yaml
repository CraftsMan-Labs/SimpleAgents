id: invoice-image-node-output-golden
workflow_path: ../../workflows/email-classification/test.yaml
dataset_path: generated/invoice-image-node-eval.dataset.jsonl
max_concurrency: 1

execution:
  node_llm_streaming: false
workflow_options:
  telemetry:
    enabled: false

comparison:
  mode: paths
  paths:
    - $.terminal_node
    - $.trace
    - $.outputs.detect_email_domain.output.domain
    - $.outputs.detect_finance_subtype.output.finance_subtype
    - $.outputs.extract_invoice_company_name.output.company_name
    - $.outputs.lookup_invoice_stakeholder.output
    - $.outputs.finalize_invoice_classification.output.top_level_category
    - $.outputs.finalize_invoice_classification.output.subtype
    - $.outputs.finalize_invoice_classification.output.label
    - $.outputs.finalize_invoice_classification.output.company_name
    - $.outputs.finalize_invoice_classification.output.stakeholder_name
