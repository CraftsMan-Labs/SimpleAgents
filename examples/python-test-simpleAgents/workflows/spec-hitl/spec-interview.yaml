id: spec-hitl-interview
version: 1.0.0
entry_node: review_spec

nodes:
  - id: review_spec
    node_type:
      llm_call:
        model: gpt-4.1-mini
        heal: true
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          overview:
            type: string
          ambiguity_hotspots:
            type: array
            items:
              type: string
        required: [overview, ambiguity_hotspots]
        additionalProperties: false
      prompt: |
        Read the specification text in input.spec_text (also echoed in the latest user message).

        Return JSON only:
        {
          "overview": "2-4 sentences on what the spec is trying to build",
          "ambiguity_hotspots": ["short bullets for unclear, risky, or missing areas"]
        }

        Focus on gaps that later Q&A should clarify. Use input.bundle_version only as metadata.

        SPEC TEXT:
        {{ input.spec_text }}

  - id: draft_questions
    node_type:
      llm_call:
        model: gpt-4.1-mini
        heal: true
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          questions:
            type: array
            minItems: 10
            maxItems: 10
            items:
              type: object
              properties:
                id:
                  type: string
                text:
                  type: string
              required: [id, text]
              additionalProperties: false
        required: [questions]
        additionalProperties: false
      prompt: |
        Using the spec text and the prior review summary below, draft exactly **10** clarification questions
        that help validate requirements before implementation.

        Rules:
        - Each question must have a stable id from this set only: q01, q02, q03, q04, q05, q06, q07, q08, q09, q10 (use each exactly once).
        - Questions must be concrete and answerable by a human who owns the product/spec.
        - Cover functional scope, edge cases, non-goals, dependencies, operational constraints, and acceptance criteria where relevant.

        Prior review (JSON): {{ nodes.review_spec.output }}

        SPEC TEXT:
        {{ input.spec_text }}

        Return JSON only:
        {
          "questions": [
            {"id": "q01", "text": "..."},
            ...
          ]
        }

  - id: collect_initial_answers
    node_type:
      human_input:
        input_type: form
        prompt: |
          Answer each question clearly. Incomplete answers may trigger follow-up rounds later.

          Questions (JSON):
          {{ nodes.draft_questions.output.questions }}
        form_schema:
          type: object
          properties:
            answer_q01:
              type: string
            answer_q02:
              type: string
            answer_q03:
              type: string
            answer_q04:
              type: string
            answer_q05:
              type: string
            answer_q06:
              type: string
            answer_q07:
              type: string
            answer_q08:
              type: string
            answer_q09:
              type: string
            answer_q10:
              type: string
          required:
            - answer_q01
            - answer_q02
            - answer_q03
            - answer_q04
            - answer_q05
            - answer_q06
            - answer_q07
            - answer_q08
            - answer_q09
            - answer_q10
          additionalProperties: false

  - id: review_answers
    node_type:
      llm_call:
        model: gpt-4.1-mini
        heal: true
        messages_path: input.messages
        append_prompt_as_user: true
    config:
      output_schema:
        type: object
        properties:
          needs_clarification:
            type: string
            enum: ["yes", "no"]
          concerns:
            type: array
            items:
              type: string
          unclear_question_ids:
            type: array
            items:
              type: string
          feedback_markdown:
            type: string
          review_summary:
            type: string
        required:
          - needs_clarification
          - concerns
          - unclear_question_ids
          - feedback_markdown
          - review_summary
        additionalProperties: false
      prompt: |
        You are reviewing human answers to spec clarification questions.

        SPEC TEXT:
        {{ input.spec_text }}

        Questions JSON:
        {{ nodes.draft_questions.output.questions }}

        Answers form JSON (fields answer_q01..answer_q10 align with q01..q10):
        {{ nodes.collect_initial_answers.output }}

        Decide if any answers are vague, contradictory, evasive, or insufficient for implementation planning.

        Return JSON only:
        {
          "needs_clarification": "yes" | "no",
          "concerns": ["short bullet strings"],
          "unclear_question_ids": ["only ids from q01..q10 that still need better answers"],
          "feedback_markdown": "bullets the human should see before optional clarification rounds",
          "review_summary": "1-3 sentences for downstream workflows"
        }

        If everything is clear enough for engineering to proceed with low ambiguity, set needs_clarification to "no"
        and use empty arrays for concerns and unclear_question_ids.

  - id: interview_complete
    node_type:
      end: {}

edges:
  - from: review_spec
    to: draft_questions
  - from: draft_questions
    to: collect_initial_answers
  - from: collect_initial_answers
    to: review_answers
  - from: review_answers
    to: interview_complete
