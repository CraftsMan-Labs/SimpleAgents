# Single-step warning-email workflow with native llm_call tool-calling
# Input: employee name + complaint in chat history
# Tool: returns employee_id + location by name

id: email-chat-draft-with-tool-calling
version: 1.0.0

metadata:
  name: "Warning Email Draft With Tool Calling"
  description: "Draft warning email using complaint + tool-fetched employee metadata"
  tags: ["example", "chat-history", "warning-email", "tool-calling"]

entry_node: draft_warning_email

nodes:
  - id: draft_warning_email
    name: "Draft Warning Email"
    node_type:
      llm_call:
        model: azure/gpt-4.1-mini
        temperature: 0.0
        messages_path: input.messages
        append_prompt_as_user: true
        stream: false
        heal: true
        tools_format: simplified
        tool_choice: auto
        max_tool_roundtrips: 1
        tool_calls_global_key: employee_record_tool_calls
        tools:
          - name: get_employee_record
            description: Resolve employee metadata by full name
            input_schema:
              type: object
              properties:
                employee_name: { type: string }
              required: [employee_name]
              additionalProperties: false
            output_schema:
              type: object
              properties:
                employee_name: { type: string }
                employee_id: { type: string }
                location: { type: string }
              required: [employee_name, employee_id, location]
              additionalProperties: false
    config:
      output_schema:
        type: object
        properties:
          subject: { type: string }
          body: { type: string }
        required: [subject, body]
        additionalProperties: false
      prompt: |
        You draft HR warning emails.

        Requirements:
        - Read the latest user message from chat history.
        - If employee name OR complaint is missing, do NOT call tools; ask one concise follow-up question.
        - If employee name and complaint are present, call get_employee_record using employee_name.
        - When tool result is available, include employee_id and location in the email body.
        - Keep tone formal, factual, and policy-compliant.
        - Do not use placeholders like [name] or [id].
        - Return JSON only.

        Missing-details response format (still JSON):
        {
          "subject": "Need one detail to proceed",
          "body": "Please share the employee full name and complaint so I can draft the warning email."
        }

        Return JSON:
        {
          "subject": "...",
          "body": "..."
        }
