name: Bindings CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  go-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Test Go bindings
        run: make test-go-bindings

  node-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/simple-agents-napi/package-lock.json
      - name: Install and run Node binding tests
        working-directory: crates/simple-agents-napi
        run: |
          npm ci
          npm test
      - name: Type-check declarations
        working-directory: crates/simple-agents-napi
        run: ./node_modules/.bin/tsc --noEmit index.d.ts
