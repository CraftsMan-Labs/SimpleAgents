name: Bindings CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  capability-contract-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against vendored docs dependencies
        run: |
          tracked_count=$(git ls-files -- "docs/node_modules" "docs/node_modules/**" | wc -l)
          if [ "$tracked_count" -ne 0 ]; then
            echo "Error: docs/node_modules has tracked files ($tracked_count)."
            echo "Remove vendored docs dependencies from git index and keep docs/package-lock.json only."
            exit 1
          fi
          echo "OK: no vendored docs dependencies are tracked."
      - name: Guard SimpleAgentsBuilder mirror drift
        run: ./scripts/check-simpleagentsbuilder-skill-links.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/simple-agents-napi/package-lock.json
      - uses: astral-sh/setup-uv@v4
      - name: Run cross-language capability contract gates
        run: ./scripts/run-binding-contracts.sh

  go-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Test Go bindings
        run: make test-go-bindings

  node-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: crates/simple-agents-napi/package-lock.json
      - name: Install and run Node binding tests
        working-directory: crates/simple-agents-napi
        run: |
          npm ci
          npm test
      - name: Type-check declarations
        working-directory: crates/simple-agents-napi
        run: ./node_modules/.bin/tsc --noEmit index.d.ts

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v4
      - name: Run Python binding tests
        working-directory: crates/simple-agents-py
        run: UV_CACHE_DIR=${{ github.workspace }}/.uv-cache uv run --with "pytest>=8.0" pytest
